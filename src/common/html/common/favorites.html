<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Favorites - ZColor</title>
    <link rel="stylesheet" href="../../css/common/base.css">
    <link rel="stylesheet" href="../../css/common/favorites.css">
</head>
<body>
    <div class="page-header">
        <a href="../index.html" class="back-btn">← Back</a>
        <h2>⭐ Favorites</h2>
    </div>
    <div id="favorites-container" class="container"></div>

    <!-- Gradient modal (required for gradient details) -->
    <div id="gradient-modal" class="modal">
        <div class="modal-content">
            <span class="modal-close">&times;</span>
            <h3>Gradient Details</h3>
            <div id="modal-preview" class="modal-preview"></div>
            <div id="modal-stops" class="modal-stops"></div>
            <div class="modal-css">
                <label>CSS Code:</label>
                <pre id="modal-css-code"></pre>
                <button id="copy-css-btn" class="copy-btn">Copy CSS</button>
            </div>
        </div>
    </div>

    <script src="../../js/entry/common/favorites.js" type="module"></script>
</body>
</html>
